paths:
  faces_root: ${FACES_ROOT}
  celebdf_root: ${CELEBDF_FACES_ROOT}
  crf_video_root: ${CRF_VIDEO_ROOT}
  dataset_root: ${DATASET_ROOT}
  splits_dir: ${SPLITS_DIR}
  metadata_csv: ${METADATA_CSV}
  runs_root: ${RUNS_ROOT}
data:
  levels:
  - c0
  - c23
  - c28
  - c32
  - c36
  - c40
  frames_per_video: 32
  methods:
  - Deepfakes
  - Face2Face
  - FaceSwap
  - NeuralTextures
  quality_mix:
  - 0.3
  - 0.4
  - 0.3
  paired_fraction: 0.25
  real_oversample: 4
  batch_size: 32
  num_workers: 8
  bin_levels:
  - c0
  - c23
  - c28
  - c32
  - c36
  - c40
  soft_label_eps: 0.1
model:
  dct:
    block: 8
    band_sizes:
    - 6
    - 10
    - 20
    - 28
    band_channels: 64
    coeff_norm: log1p
    layout: channelized
  phase:
    window: 32
    channels:
    - 64
    - 128
    - 256
    head_pairs: 32
  estimator:
    emb_dim: 64
    num_bins: 6
    joint_training: true
  fusion:
    kind: cmam
    stream_dim: 256
  discriminator:
    hidden: 1024
    dropout: 0.5
    spectral_norm: true
  invariance_arm: grl
  backbone: efficientnet_b0
  backbone_full_head: false
  conditioning: estimated
  fusion_conditioning: estimated
loss:
  cls_smoothing: 0.05
  w_crf: 0.2
  w_div: 1.0
  w_freq_aux: 0.0
  div_s_max: 0.3
  w_cons: 0.5
  w_phase: 0.3
  w_circ_rel: 0.2
  grl_lambda_max: 0.5
  hsic_ratio:
  - 1.0
  - 5.0
  hsic_sigma: median
  hsic_cka: false
train:
  lr_freq: 0.0001
  lr_backbone: 1.0e-05
  lr_disc: 0.0001
  weight_decay: 0.0001
  epochs: 50
  phase_bounds:
  - 10
  - 25
  curriculum: baby_step
  ema_decay: 0.999
  grad_clip: 1.0
  amp: bf16
  seed: 1
  grl_ramp: phase_anchored
  step_log_every: 50
  step_log_detail: false
  val_raw: false
eval:
  bootstrap_b: 10000
  frames_per_video: 32
  ci: 0.95
baseline:
  model: effnet_b0
  protocol: mq
  lr: 0.0002
  weight_decay: 0.0001
  epochs: 30
  grad_clip: 1.0
  warmup_epochs: 1
  pretrained: true
  p2: none
  jpeg_qf_range:
  - 30
  - 95
  use_aug: false
  train_levels_override:
  - c0
  - c23
  - c28
  - c32
  - c36
  selector_levels:
  - c23
  - c36
  jpeg_calibration: null
  jpeg_arm: null
  allow_fixture_calibration: false
  train_levels:
  - c0
  - c23
  - c28
  - c32
  - c36
baseline_run:
  subset_fraction: 1.0
  max_epochs: 30
  batch_size: 32
  num_workers: 8
  seed: 1
  amp: bf16
  device: cuda
  mix_compensation: true
  jpeg_level_to_qf: null
  jpeg_availability_c0_restriction: null
  note: 'baseline runs read lr/epochs/warmup/wd from the baseline: block; the train:
    block''s CAFRL optimizer fields are unused'
provenance:
  argv:
  - --config
  - configs/phase6/r1_sb_noc40_s1.yaml
  - --name
  - r1_sb_noc40_s1
  cv2_version: 4.13.0
  torch_version: 2.5.1
  jpeg_calibration: null
  written_utc: '2026-10-12T01:11:16Z'
  git_commit: 40e6b1bf80a6636cc19235ec28dfb13571984532
  git_dirty: false
  git_dirty_count: 0
  git_dirty_paths: []
