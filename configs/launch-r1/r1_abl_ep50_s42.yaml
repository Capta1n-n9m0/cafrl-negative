# Phase 6 (Revision 1, W0) — E13 r1_abl_ep50_s42: Fair-N with ONE change reverted to a0 — training length reverted to a0's 50 epochs.
#
# Parent: configs/phase5/f1_none_fair_s42.yaml (Fair-N, seed 42; invariance_arm none, so no
# adversary and no λ ramp). Its body is repeated below with the one change.
# Diff vs the resolved parent (the declared line-set, nothing else):
#   train.epochs          : 30 -> 50               a0's value; the cosine horizon
#                           (T_max = train.epochs) stretches with it. NEVER the max-epochs CLI flag
#                           (S0 m2: T_max would stay 30 and the LR would rise after epoch 30).
#   train.val_raw         : false -> true            log raw AND EMA val AUC (kickoff §3)
# Why: decision "Revision 1 W0: five-arm recipe ablation" (5).
# Not reverted (stated in the paper): batch 32 on one GPU (a0: 2 GPUs), lr_disc (moot: no disc).
# E13 is descriptive (one seed, no test).
#
# Run: python -m src.train --config configs/phase6/r1_abl_ep50_s42.yaml --name r1_abl_ep50_s42
#      (one GPU, no torchrun; never the max-epochs or subset-fraction flags; via runs/phase6_build/launch.sh)
# Eval: python -m src.scripts.eval_battery --run r1_abl_ep50_s42 --bn-routing clean
#       python -m src.scripts.eval_faceshifter --run r1_abl_ep50_s42
# Selection: unchanged trainer rule = EMA weights, best mean val AUC over c23 + c40 (Fair-N's).
# Every diff below is checked against the resolved parent by src/tests/test_phase6_configs.py.
model:
  invariance_arm: none
train:
  curriculum: flat
  lr_freq: 0.0002
  lr_backbone: 0.0002
  lr_disc: 0.0002
  epochs: 50
  seed: 42
  val_raw: true
loss:
  w_cons: 0.0
  w_phase: 0.0
  w_circ_rel: 0.0
  w_div: 0.0
