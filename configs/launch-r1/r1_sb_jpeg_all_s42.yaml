# Phase 6 (Revision 1, W0) — E3a r1_sb_jpeg_all_s42: SpatialBase on c0 frames with matched JPEG for every H.264 level.
#
# Parent: the b7 recipe (runs/b7_effnet_b0_mq_fliponly{,_s1,_s2}), i.e.
#   python -m src.scripts.train_baseline --model effnet_b0 --protocol mq --no-aug --seed <S>
#   = effnet_b0, protocol mq (six levels c0..c40, mix 0.3/0.4/0.3, paired 0.25), flip-only,
#   lr 2e-4, wd 1e-4, 30 epochs, warmup 1, batch 32, no EMA, selection = best mean val AUC
#   over c23 + c40 (real H.264 val crops).
# Format: everything lives in this YAML (`baseline:` block = BaselineTrainConfig fields,
#   `train.seed` = the seed); launch.sh passes only --config and --name:
#   python -m src.scripts.train_baseline --config configs/phase6/r1_sb_jpeg_all_s42.yaml --name r1_sb_jpeg_all_s42
# Eval: python -m src.scripts.eval_battery --run r1_sb_jpeg_all_s42 --baseline
#       python -m src.scripts.eval_faceshifter --run r1_sb_jpeg_all_s42 --baseline
# The b7-recipe fields are written out explicitly (lr, weight_decay, epochs, warmup_epochs,
# model, protocol, use_aug); they equal the defaults/b7's flags. The mix compensation
# (decision "Phase 6 build: compensated singles quota for asymmetric level sets") is always on
# in train_baseline and is a proven no-op for six levels and c23-only.
# Every diff below is checked against the resolved b7 recipe by src/tests/test_phase6_configs.py.
# Diff vs the resolved b7 recipe at seed 42 (the declared line-set, nothing else):
#   baseline.jpeg_calibration: null -> runs/phase6_build/jpeg_calibration.json (the REAL,
#                              status "final" file; the trainer refuses anything else)
#   baseline.jpeg_arm        : null -> r1_sb_jpeg_all (cross-check: arm_levels = six levels)
#   Levels unchanged (all six); each level L != c0 loads the c0 crop and re-encodes it as JPEG
#   at QF(L) (mean crop PSNR matched to L) before flip; same plan/mix/pairs as b7.
#   Selection unchanged: val c23 + c40 on REAL H.264 val crops (conservative, kickoff §3).
# Why: decision "Revision 1 W0: matched JPEG on c0 frames, plus a c23-only anchor".
train:
  seed: 42
baseline:
  model: effnet_b0
  protocol: mq
  use_aug: false
  lr: 0.0002
  weight_decay: 0.0001
  epochs: 30
  warmup_epochs: 1
  selector_levels: [c23, c40]
  jpeg_calibration: runs/phase6_build/jpeg_calibration.json
  jpeg_arm: r1_sb_jpeg_all
