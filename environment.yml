# The environment every released number was produced in.
#
# 141 conda packages + 74 pip packages, pinned to the exact
# version and build that ran. This is the full research environment — CUDA
# PyTorch included — and installing it makes sense only if you intend to re-run
# training or a GPU evaluation pass.
#
# To check the paper's tables against the released predictions you do not need
# any of this: `env/environment-verify.yml` is a five-package CPU-only subset and
# is what `verify/verify.py` runs under.
#
# Exact-build pins are deliberate and will fail to solve on a different platform
# (linux-64 only). `env/conda-linux-64.explicit.txt` is the same set as resolved
# URLs with checksums; `env/environment.full.yml` is conda's own export;
# `env/pip-freeze.txt` lists the pip side alone.
